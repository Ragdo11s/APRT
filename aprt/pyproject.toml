[project]
name = "aprt"
version = "0.1.0"
description = "Automated Progressive Recon & Testing harness"
requires-python = ">=3.10"

dependencies = [
    "pyyaml>=6.0",
    "cvss"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]